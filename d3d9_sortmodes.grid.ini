; dirt-d3d9-sortmodes settings for Race Driver: GRID (2008). Put this file next to d3d9.dll as d3d9_sortmodes.ini.
[modes]
; GRID keeps detected modes in a 16 KB memory pool, so keep the list short.
; Keep only modes with this exact aspect ratio:
only_aspect=16:9
; List each resolution once, at the refresh rate closest to this.
; Set it to the refresh rate in GRID's settings (for example 120), or GRID falls back to a lower resolution:
refresh=60
; Write the returned mode list to d3d9_sortmodes.log:
log=0
