; dirt-d3d9-sortmodes settings. Put this file next to d3d9.dll.
[modes]
; Keep only modes with this exact aspect ratio:
; only_aspect=16:9
; List each resolution once, at the refresh rate closest to this. DiRT needs it on TVs with many modes:
refresh=60
; Write the returned mode list to d3d9_sortmodes.log:
log=0
