; dirt-d3d9-sortmodes settings for Colin McRae: DiRT (2007). Put this file next to d3d9.dll.
[modes]
; DiRT keeps detected modes in a 100 KB memory pool, so keep the list short.
; Keep only modes with this exact aspect ratio:
; only_aspect=16:9
; List each resolution once, at the refresh rate closest to this.
; Set it to the refresh rate in DiRT's settings, or DiRT falls back to a lower resolution:
refresh=60
; Write the returned mode list to d3d9_sortmodes.log:
log=0
